<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AdEarn</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
background:#f7f9fb;
color:#11192d;
}

body{
padding-bottom:82px;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
}

.top{
height:96px;
background:#fff;
border-bottom:1px solid #e4e9ee;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 28px;

top:0;
z-index:20;

.brand{

.brandmark{

height:60px;

.playerdesc{

.video{

.video:before{

.videoContent{

.bigplay{

height:90px;

.playing{

.progress{

}

.walletlabel{

font-size:16px;
letter-spacing:1px;
}

.walletamount{

}

.min{

.gateway{

border:1px solid #ffffff22;

}

.gatewaymain{

font-weight:700;

}

.field{

}

.field label{

}

.field input,
.field select{

border-radius:17px;

}

.save{

height:65px;

color:#fff;

.withdraw{
margin-top:30px;
}

.withdraw h2{

}

.otpbox{
background:#fffbed;
border:2px solid #f0e29b;
border-radius:22px;

margin-top:25px;
}

.otpbtn{
width:100%;
height:50px;
background:#df8300;
border:0;
border-radius:12px;
color:#fff;
font-weight:800;
}

.history{
display:flex;
gap:18px;
padding:22px 0;

}

.check{
width:55px;
height:55px;
border-radius:16px;

color:#079b70;

.historydate{

margin-top:6px;
}

.historyreward{
color:#079b70;

}

.refbox{

color:#fff;
border-radius:34px;

margin-top:35px;
}

.refcode{

font-weight:800;
letter-spacing:4px;
margin:20px 0;
}

.copy{
background:#10b981;
border:0;
border-radius:12px;
padding:13px 18px;
font-weight:800;
}

.stat{
background:#fff;
border:2px solid #e1e7ec;
border-radius:25px;
padding:28px;
margin-top:20px;
}

.statlabel{
color:#718096;
}

.statvalue{
font-size:42px;
margin-top:10px;
font-weight:700;
}

.green{
color:#079b70;
}

.profilehead{
display:flex;
align-items:center;
gap:22px;
padding-bottom:30px;
border-bottom:1px solid #e5ebef;
}

.profileavatar{
width:95px;
height:95px;
border-radius:50%;
background:#079b70;
color:#fff;
display:grid;
place-items:center;
font-size:38px;
}

.profilehead h2{
margin:0 0 7px;
font-size:27px;
}

.profilehead p{
margin:0;
color:#718096;
}

.footer{
text-align:center;
color:#718096;
margin:60px 0 20px;
}

.bottom{
position:fixed;
left:0;
right:0;
bottom:0;
height:80px;
background:#fff;
border-top:1px solid #dfe5ea;
display:flex;
z-index:50;
}

.nav{
flex:1;
border:0;
background:#fff;
color:#718096;
font-size:13px;
font-weight:700;
}

.navicon{
display:block;
font-size:25px;
margin-bottom:3px;

.nav.active{

.dropdown{
position:fixed;
right:25px;
top:105px;
width:350px;
background:#fff;
border-radius:24px;
box-shadow:0 20px 50px #0003;
border:1px solid #dce3e8;
z-index:80;
overflow:hidden;
}

.drophead{
padding:24px;
border-bottom:1px solid #e7edf1;
}

.dropname{
font-size:21px;
font-weight:800;
}

.dropemail{
font-size:16px;
color:#718096;
margin-top:5px;
}

.dropitem{
padding:18px 24px;
border-bottom:1px solid #eef1f4;
font-size:18px;
font-weight:700;
}

.dropitem:last-child{
color:#c63b3b;
border:0;
}

.toast{
position:fixed;
top:25px;
left:50%;
transform:translateX(-50%);
width:min(650px,92%);
background:#ecfff6;
border:2px solid #b9efd9;
color:#187d59;
border-radius:18px;
padding:18px 22px;
z-index:110;
box-shadow:0 15px 40px #0002;
font-size:17px;
line-height:1.5;
}

.toast b{
display:block;
font-size:19px;
}

.toastcheck{
display:inline-grid;
width:28px;
height:28px;
border-radius:50%;
background:#079f72;
color:#fff;
place-items:center;
margin-right:8px;
}

.confetti{
position:fixed;
inset:0;
pointer-events:none;
overflow:hidden;
z-index:100;
}

.confetti i{
position:absolute;
top:-30px;
width:9px;
height:24px;
animation:fall 3s linear forwards;
}

.confetti i:nth-child(3n){
background:#ef70c8;
}

.confetti i:nth-child(3n+1){
background:#61cce8;
}

.confetti i:nth-child(3n+2){
background:#f8d65e;
}

@keyframes fall{
0%{
transform:translateY(-30px) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(720deg);
}
}

.brandmark{

}

.brandname{

}

.publisher{

}

.headright{
gap:7px;
}

.balance{

}

.avatar{

}

}

.homebtn{

}

.card{

border-radius:27px;
}

.campaign{
padding:20px;
}

.campaignname{

}

.campaigndesc{
font-size:14px;
max-width:210px;
}

.reward{
font-size:18px;
}

.player{
border-radius:27px;
}

.video{

}

.ready{
padding:45px 10px;
}

.ready h2{

}

.ready p{

}

.readybuttons{
gap:10px;
}

.next{
height:78px;
font-size:17px;
}

.viewwallet{
height:78px;
font-size:15px;
}

.walletHero{
padding:35px 25px;
}

}

width:calc(100% - 30px);
}

<body>

<div id="app"></div>
<div id="toast"></div>
<div id="confetti"></div>

<script>

let me=null;
let page="tasks";
let currentAd=null;
let timer=null;

const $=id=>document.getElementById(id);

async function api(url,options={}){

const response=await fetch(url,{
credentials:"include",
headers:{
"Content-Type":"application/json",
...(options.headers||{})
},
...options
});

let data={};

try{
data=await response.json();
}catch(e){}

if(!response.ok){
throw new Error(data.error||"Request failed");
}

return data;
}

async function load(){

try{

const data=await api("/api/me");

me=data.user;

render();

}catch(e){

me=null;

renderLogin();

}

}

function initial(){

return String(me?.name||"U").trim().charAt(0).toUpperCase();

}

function money(value){

return "₹"+Number(value||0).toFixed(2);

}

function header(){

return `
<header class="top">

<div class="brand">

<div class="brandmark">AE</div>

<div>
<div class="brandname">AdEarn</div>
<div class="publisher">PUBLISHER & VIEWER</div>
</div>

</div>

<div class="headright">

<div class="balance">
<span class="dot"></span>
Balance: <b>${money(me.balance)}</b>
</div>

<button class="avatar" onclick="toggleMenu()">
<span>${initial()}</span>
</button>

</div>

</header>
`;

}

function navigation(){

return `
<nav class="bottom">

<button class="nav ${page==="tasks"?"active":""}" onclick="go('tasks')">
<span class="navicon">⌂</span>
Home
</button>

<button class="nav ${page==="wallet"?"active":""}" onclick="go('wallet')">
<span class="navicon">▣</span>
Wallet
</button>

<button class="nav ${page==="history"?"active":""}" onclick="go('history')">
<span class="navicon">▤</span>
History
</button>

<button class="nav ${page==="refer"?"active":""}" onclick="go('refer')">
<span class="navicon">♧</span>
Refer
</button>

<button class="nav ${page==="profile"?"active":""}" onclick="go('profile')">
<span class="navicon">♙</span>
Account
</button>

</nav>
`;

}

function layout(title,subtitle,content){

return `
${header()}

<main class="page">

<div class="headingrow">

<div>
<h1>${title}</h1>
<p class="subtitle">${subtitle}</p>
</div>

<button class="homebtn" onclick="go('tasks')">⌂ Home</button>

</div>

${content}

</main>

${navigation()}
`;

}

function render(){

if(!me){
renderLogin();
return;
}

if(page==="wallet")renderWallet();
else if(page==="history")renderHistory();
else if(page==="refer")renderRefer();
else if(page==="profile")renderProfile();
else renderTasks();

}

function renderLogin(){

document.body.innerHTML=`

<main class="login">

<section class="card">

<div class="brand">

<div class="brandmark">AE</div>

<div>
<div class="brandname">AdEarn</div>
<div class="publisher">PUBLISHER & VIEWER</div>
</div>

</div>

<h2 style="font-size:30px;margin-top:35px">
Welcome Back
</h2>

<p class="subtitle">
Sign in to continue earning.
</p>

<div class="field">

<label>Email</label>

<input id="loginEmail"
value="rahul.sharma@example.com">

</div>

<div class="field">

<label>Password</label>

<input id="loginPassword"
type="password"
value="demo123">

</div>

<button class="save" onclick="login()">
Sign In
</button>

<div id="loginError"></div>

</section>

</main>
`;

}

async function login(){

try{

await api("/api/login",{
method:"POST",
body:JSON.stringify({
email:$("loginEmail").value,
password:$("loginPassword").value
})
});

await load();

}catch(e){

$("loginError").innerHTML=
`<div class="error">${e.message}</div>`;

}

}

function renderTasks(){

api("/api/tasks").then(data=>{

let player="";

if(currentAd){

player=`

<section class="player">

<div class="playerhead">

<span class="tag">
LIVE DEMO AD #${currentAd.id}
</span>

<div class="playername">
${currentAd.title}
</div>

<div class="playerdesc">
${currentAd.description}
</div>

</div>

<div class="video"
style="background-image:url('${currentAd.image}')">

<div class="videoContent">

<div class="bigplay">
▶
</div>

<div class="playing">
Playing Advertisement
</div>

<div class="timer">
Please watch completely.
Time remaining:
<strong id="count">9s</strong>
</div>

<div class="progress">
<i id="progress"></i>
</div>

<button class="skip" onclick="finishAd()">
Skip Timer — Demo
</button>

</div>

</div>

</section>

`;

}

const campaigns=data.tasks.map(ad=>`

<div class="campaign">

<div>

<span class="tag">
CAMPAIGN #${ad.id}
</span>

<div class="campaignname">
${ad.title}
</div>

<div class="campaigndesc">
${ad.description}
</div>

</div>

<div style="text-align:right">

<div class="reward">
${money(ad.reward)}
</div>

<button class="play"
onclick="startAd(${ad.id})">
▶
</button>

</div>

</div>

`).join("");

document.getElementById("app").innerHTML=
layout(
"Task & Ad Player",
"Watch advertisements and earn rewards for successful views.",
`

${player}

${
!currentAd?

`

<section class="card ready">

<div class="readyicon">
✓
</div>

<h2>
Ready for the Next Ad?
</h2>

<p>
You can watch as many ads as you want.
Each successful view adds ₹1.00 to your balance.
</p>

<div class="readybuttons">

<button class="next"
onclick="startAd()">
▶ &nbsp; Watch Next Ad
</button>

<button class="viewwallet"
onclick="go('wallet')">
View<br>Wallet
</button>

</div>

</section>

`

:""
}

<section class="card">

<h2>
Available Ad Campaigns
</h2>

${campaigns}

</section>

<div class="footer">
AdEarn © 2026 • All Rights Reserved
</div>

`
);

});

}

async function startAd(id){

try{

const data=await api("/api/tasks");

currentAd=
data.tasks.find(x=>Number(x.id)===Number(id))
||
data.tasks[0];

render();

let seconds=9;

clearInterval(timer);

timer=setInterval(()=>{

seconds--;

if($("count")){
$("count").textContent=seconds+"s";
}

if($("progress")){
$("progress").style.width=
((9-seconds)/9*100)+"%";
}

if(seconds<=0){

clearInterval(timer);

finishAd();

}

},1000);

}catch(e){

alert(e.message);

}

}

async function finishAd(){

if(!currentAd)return;

clearInterval(timer);

try{

const completed=currentAd;

const result=await api("/api/reward",{
method:"POST",
body:JSON.stringify({
taskId:completed.id
})
});

me.balance=result.balance;
me.points=result.points;

currentAd=null;

celebration(
completed.title,
result.reward
);

render();

}catch(e){

alert(e.message);

}

}

function celebration(title,reward){

let html="";

for(let i=0;i<80;i++){

html+=`
<i
style="
left:${Math.random()*100}%;
animation-delay:${Math.random()*1.5}s;
transform:rotate(${Math.random()*360}deg);
">
</i>
`;

}

$("confetti").innerHTML=html;

setTimeout(()=>{
$("confetti").innerHTML="";
},4000);

$("toast").innerHTML=`

<div class="toast">

<span class="toastcheck">
✓
</span>

<b>
🎉 Ad Completed!
${money(reward)} added to your wallet!
</b>

Successfully watched: ${title}

</div>

`;

setTimeout(()=>{
$("toast").innerHTML="";
},5000);

}

async function renderWallet(){

document.getElementById("app").innerHTML=
layout(
"Wallet & Payouts",
"Manage your balance and withdraw your earnings.",
`

<section class="walletHero">

<div class="walletlabel">
TOTAL AVAILABLE BALANCE
</div>

<div class="walletamount">
${money(me.balance)}
</div>

<div class="min">
Minimum withdrawal: <b>₹100.00</b>
</div>

<div class="gateway">

<div>
Payout Gateway Integration
</div>

<div class="gatewaymain">
♧ Cashfree Payouts Ready
</div>

</div>

</section>

<section class="card withdraw">

<h2>
Withdraw Funds
</h2>

<div class="field">

<label>
Withdrawal Method
</label>

<select id="method">

<option value="upi">
UPI ID — Instant Transfer
</option>

<option value="bank">
Bank Account — NEFT / IMPS
</option>

</select>

</div>

<div class="field">

<label>
Amount to Withdraw
</label>

<input
id="amount"
type="number"
min="100"
value="100">

</div>

<div class="field">

<label>
Your UPI ID
</label>

<input
id="upi"
value="${me.upi||""}"
placeholder="example@upi">

</div>

<div class="otpbox">

<b>
Gmail OTP Required
</b>

<p>
Request a fresh OTP before every withdrawal.
</p>

<button
class="otpbtn"
onclick="sendWithdrawalOTP()">
Send Withdrawal OTP
</button>

<div class="field">

<input
id="otp"
maxlength="6"
placeholder="Enter 6-digit OTP">

</div>

</div>

<button
class="save"
onclick="withdraw()">

</button>

</section>

`
);

}

async function sendWithdrawalOTP(){

try{

const result=
await api("/api/withdrawal-otp",{
method:"POST"
});

alert(result.message);

}catch(e){

alert(e.message);

}

}

async function withdraw(){

try{

const amount=Number($("amount").value);

const result=
await api("/api/withdraw",{
method:"POST",
body:JSON.stringify({
amount,
method:$("method").value,
upi:$("upi").value,
otp:$("otp").value
})
});

me.balance=result.balance;

alert(result.message);

render();

}catch(e){

alert(e.message);

}

}

async function renderHistory(){

const data=
await api("/api/history");

const rows=data.items.map(item=>`

<div class="history">

<div class="check">
✓
</div>

<div>

<div class="historytitle">
${item.title}
</div>

<div class="historydate">
${item.date}
</div>

<div class="historyreward">
+${money(item.reward)}
</div>

</div>

</div>

`).join("");

document.getElementById("app").innerHTML=
layout(
"Task & Ad Submissions",
"History of your completed advertisements.",
`

<section class="card">

${rows||`
<p class="subtitle">
No submissions yet.
</p>
`}

</section>

`
);

}

function renderRefer(){

document.getElementById("app").innerHTML=
layout(
"Refer & Earn",
"Invite friends and earn rewards after successful referrals.",
`

<section class="refbox">

<div style="color:#76d9bd;letter-spacing:2px">
YOUR REFERRAL CODE
</div>

<div class="refcode">
${me.referralCode}
</div>

<button
class="copy"
onclick="copyReferral()">
Copy Referral Code
</button>

</section>

<section class="stat">

<div class="statlabel">
Successful Referrals
</div>

<div class="statvalue">
${me.successfulReferrals}
</div>

</section>

<section class="stat">

<div class="statlabel">
Referral Earnings
</div>

<div class="statvalue green">
${money(me.referralEarnings)}
</div>

</section>

`
);

}

async function copyReferral(){

try{

await navigator.clipboard.writeText(me.referralCode);

alert("Referral code copied.");

}catch(e){

alert("Copy failed.");

}

}

function renderProfile(){

document.getElementById("app").innerHTML=
layout(
"User Profile",
"Update your account information.",
`

<section class="card">

<div class="profilehead">

<div class="profileavatar">
${initial()}
</div>

<div>

<h2>
${me.name}
</h2>

<p>
${me.email}
</p>

<span class="tag">
Verified Publisher Account
</span>

</div>

</div>

<div class="field">

<label>
Email Address
</label>

<input
disabled
value="${me.email}">

</div>

<div class="field">

<label>
Full Name
</label>

<input
id="profileName"
value="${me.name}">

</div>

<div class="field">

<label>
Mobile Number
</label>

<input
id="profileMobile"
value="${me.mobile||""}">

</div>

<div class="field">

<label>
City
</label>

<input
id="profileCity"
value="${me.city||""}">

</div>

<div class="field">

<label>
UPI ID
</label>

<input
id="profileUPI"
value="${me.upi||""}">

</div>

<button
class="save"
onclick="saveProfile()">
Save Changes
</button>

</section>

`
);

}

async function saveProfile(){

try{

const result=
await api("/api/profile",{
method:"PUT",
body:JSON.stringify({
name:$("profileName").value,
mobile:$("profileMobile").value,
city:$("profileCity").value,
upi:$("profileUPI").value
})
});

me=result.user;

alert("Profile updated successfully.");

render();

}catch(e){

alert(e.message);

}

}

function toggleMenu(){

const old=document.querySelector(".dropdown");

if(old){

old.remove();

return;

}

document.body.insertAdjacentHTML(
"beforeend",
`

<div class="dropdown">

<div class="drophead">

<div class="dropname">
${me.name}
</div>

<div class="dropemail">
${me.email}
</div>

</div>

<div
class="dropitem"
onclick="closeMenu();go('profile')">
♙ &nbsp; Update Profile
</div>

<div
class="dropitem"
onclick="closeMenu();go('refer')">
♧ &nbsp; Refer & Earn
</div>

<div
class="dropitem"
onclick="closeMenu();go('history')">
▤ &nbsp; Task History
</div>

<div
class="dropitem"
onclick="logout()">
↪ &nbsp; Logout
</div>

</div>

`
);

}

function closeMenu(){

const menu=document.querySelector(".dropdown");

if(menu)menu.remove();

}

async function logout(){

try{

await api("/api/logout",{
method:"POST"
});

location.reload();

}catch(e){

alert(e.message);

}

}

function go(target){

closeMenu();

clearInterval(timer);

currentAd=null;

page=target;

render();

}

load();

</script>
